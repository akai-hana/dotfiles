blur = {
    method = "dual_kawase"; # -80% perf cut compared to regular gaussian blur algos
};

backend = "egl"; # modern alternative to glx
vsync = false;   # vsync just adds latency...

# glx-no-stencil = true;
# glx-no-rebind-pixmap = true;

# shader render optimization
use-damage = true;

# fullscreen optimization
unredir-if-possible = true;

# anti-flicker
fading = false;
unredir-if-possible = false;
