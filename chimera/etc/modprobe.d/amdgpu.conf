# patch stolen from cachyos-settings by akai :P

# SI/CIK support is compiled out of this kernel, so do not pass
# si_support/cik_support (unknown params make modprobe fail).
# Disable PSR, PSR-SU and Panel Replay to fix panel wake from DPMS/idle
# (DMCUB / black screen on the RX 6800M-driven eDP panel).
options amdgpu dcdebugmask=0x610
