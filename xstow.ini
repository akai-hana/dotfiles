### akai_hana's dotfiles' xstow ignore list! ###

[matches]

# non-$HOME directories (to be targeted manually)
ignore = etc
ignore = usr
ignore = dev

# my other stuff
ignore = .archive
ignore = .opencode
ignore = Makefile
ignore = TO-DO.txt

# external cursor theme (copy instead of symlink, since it is a
# separate repository symlinked into the package)
copy = milk-cursor

# other more generic/common stuff
## git
ignore = .git
ignore = .gitignore
ignore = .gitmodules
## txt files
ignore = README*
ignore = LICENSE*
ignore = COPYING
## others
ignore = *.swp
ignore = *.bak
ignore = *~
